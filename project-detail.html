<!doctype html>
<html lang="en" class="lenis lenis-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Detail | Athira O K</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Remix Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.1.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <!-- Lenis for Smooth Scrolling -->
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
    <!-- Project Data -->
    <script src="./src/projects-data.js"></script>
    <!-- PhotoSwipe CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/photoswipe@5.4.4/dist/photoswipe.min.css" />
    <!-- External CSS -->
    <link rel="stylesheet" href="./src/main.css" />
    <style>
      body {
        opacity: 1 !important;
        visibility: visible !important;
        cursor: auto !important;
      }
      .text-stroke {
        -webkit-text-stroke: 1px var(--color-primary);
        color: transparent;
      }
      .project-image-container {
        border: 1px solid var(--color-primary);
        background: #f0f0f0;
        cursor: zoom-in;
      }
      .project-image-container img {
        width: 100%;
        height: auto;
        display: block;
      }
      .tag {
        font-family: "Space Mono", monospace;
        font-size: 0.75rem;
        padding: 0.25rem 0.75rem;
        border-radius: 9999px;
        background: var(--color-highlight);
        color: var(--color-primary);
        font-weight: bold;
      }
    </style>
  </head>
  <body class="bg-accent antialiased selection:bg-[#F96E5B] selection:text-white">
    <!-- Custom Cursor -->
    <div class="cursor-dot hidden md:block"></div>
    <div class="cursor-outline hidden md:block"></div>

    <!-- Navigation -->
    <nav class="fixed top-0 w-full p-6 md:p-8 flex justify-between items-center z-50 text-primary bg-accent/90 backdrop-blur-md">
      <a href="index.html" class="text-xl md:text-2xl font-black tracking-tighter uppercase">ATHIRA.OK</a>
      <a href="collections.html" class="magnetic-btn px-4 md:px-6 py-2 border border-primary rounded-full font-mono text-xs md:text-sm flex items-center gap-2">
        <i class="ri-arrow-left-line"></i> BACK TO COLLECTIONS
      </a>
    </nav>

    <main class="pt-32 pb-20 px-6 md:px-20 max-w-7xl mx-auto" id="project-content">
      <div class="flex items-center justify-center h-[60vh]">
        <div class="text-2xl font-mono animate-pulse">LOADING PROJECT...</div>
      </div>
    </main>

    <footer class="py-10 text-center text-primary/50 font-mono text-xs border-t border-primary/10">
      &copy; 2026 ATHIRA O K | ALL RIGHTS RESERVED
    </footer>

    <script>
      // 0. Reveal body
      if (typeof gsap !== 'undefined') {
        gsap.set("body", { autoAlpha: 1 });
      }

      // 1. Initialize Lenis
      const lenis = new Lenis();
      function raf(time) {
        lenis.raf(time);
        requestAnimationFrame(raf);
      }
      requestAnimationFrame(raf);

      // 2. Project Loading Logic
      window.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const projectId = urlParams.get('id');
        const projectsData = window.projectsData || [];
        const project = projectsData.find(p => p.id === projectId);

        const content = document.getElementById('project-content');

        if (!project) {
          content.innerHTML = `
            <div class="flex flex-col items-center justify-center h-[60vh] text-center">
              <h1 class="text-6xl font-black mb-4">404</h1>
              <p class="text-xl font-mono mb-8">Project not found.</p>
              <a href="collections.html" class="px-8 py-3 bg-primary text-white rounded-full">BACK TO COLLECTIONS</a>
            </div>
          `;
        } else {
          renderProject(project);
        
          // Ensure ScrollTrigger calculates correctly after content injection
          if (typeof ScrollTrigger !== 'undefined') {
            ScrollTrigger.refresh();
          }

          // Initialize Lightbox
          initLightbox();
        }
      });

      function renderProject(p) {
        const content = document.getElementById('project-content');
        content.innerHTML = `
          <div class="space-y-12 md:space-y-20">
            <!-- Header -->
            <header>
              <div class="flex items-center gap-4 mb-6" data-gsap="fade-up">
                <span class="tag">${p.category}</span>
              </div>
              <h1 class="text-5xl md:text-8xl font-black tracking-tighter leading-none mb-8" data-gsap="fade-up">
                ${p.title.split(' ')[0]}<br />
                <span class="text-stroke">${p.title.split(' ').slice(1).join(' ') || ''}</span>
              </h1>
            </header>

            <!-- Hero Image -->
            <div class="project-image-container shadow-2xl" data-gsap="zoom-in">
              <a href="${p.image}" 
                 id="project-image-link"
                 data-pswp-width="1920" 
                 data-pswp-height="1080" 
                 target="_blank">
                <img src="${p.image}" alt="${p.title}" id="project-main-image" />
              </a>
            </div>

            <!-- Details Grid -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-12 md:gap-20">
              <div class="lg:col-span-2 space-y-10">
                <section data-gsap="fade-up">
                  <h3 class="text-xs font-mono text-primary/50 uppercase tracking-widest mb-4">Description</h3>
                  <p class="text-xl md:text-2xl text-gray-700 leading-relaxed font-light">
                    ${p.description}
                  </p>
                </section>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
                  <section data-gsap="fade-up">
                    <h3 class="text-xs font-mono text-primary/50 uppercase tracking-widest mb-4">The Process</h3>
                    <p class="text-gray-600 leading-relaxed">
                      ${p.process}
                    </p>
                  </section>
                  <section data-gsap="fade-up">
                    <h3 class="text-xs font-mono text-primary/50 uppercase tracking-widest mb-4">The Outcomes</h3>
                    <p class="text-gray-600 leading-relaxed">
                      ${p.outcomes}
                    </p>
                  </section>
                </div>
              </div>

              <div class="space-y-10">
                <section data-gsap="fade-up">
                  <h3 class="text-xs font-mono text-primary/50 uppercase tracking-widest mb-4">Technologies</h3>
                  <div class="flex flex-wrap gap-2">
                    ${p.tech.map(t => `<span class="px-3 py-1 border border-primary/20 rounded-full text-xs font-mono">${t}</span>`).join('')}
                  </div>
                </section>

                <div class="pt-10 border-t border-primary/10" data-gsap="fade-up">
                   <a href="index.html#contact" class="magnetic-btn w-full py-4 bg-primary text-white font-bold flex items-center justify-start pl-8 gap-2 rounded-lg">
                    START A SIMILAR PROJECT <i class="ri-arrow-right-line"></i>
                   </a>
                </div>
              </div>
            </div>
          </div>
        `;

        initAnimations();
      }

      function initAnimations() {
        gsap.registerPlugin(ScrollTrigger);
        
        // Element animations
        gsap.utils.toArray('[data-gsap="fade-up"]').forEach((el, i) => {
          gsap.from(el, {
            y: 50,
            opacity: 0,
            duration: 1,
            scrollTrigger: {
              trigger: el,
              start: "top 90%",
              toggleActions: "play none none reverse"
            }
          });
        });

        gsap.from('[data-gsap="zoom-in"]', {
          scale: 0.95,
          opacity: 0,
          duration: 1.5,
          ease: "power2.out"
        });

        initCursor();
      }

      function initCursor() {
        const cursorDot = document.querySelector(".cursor-dot");
        const cursorOutline = document.querySelector(".cursor-outline");
        let mouseX = 0, mouseY = 0;
        let cursorX = 0, cursorY = 0;

        window.addEventListener("mousemove", (e) => {
          mouseX = e.clientX;
          mouseY = e.clientY;
          gsap.to(cursorDot, { x: mouseX, y: mouseY, duration: 0 });
        });

        function animateCursor() {
          let dt = 0.2;
          cursorX += (mouseX - cursorX) * dt;
          cursorY += (mouseY - cursorY) * dt;
          if(cursorOutline) {
            cursorOutline.style.left = cursorX + "px";
            cursorOutline.style.top = cursorY + "px";
          }
          requestAnimationFrame(animateCursor);
        }
        animateCursor();

        document.querySelectorAll(".magnetic-btn").forEach((btn) => {
          btn.addEventListener("mousemove", (e) => {
            const rect = btn.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            gsap.to(btn, { x: x * 0.3, y: y * 0.3, duration: 0.3 });
            if(cursorOutline) gsap.to(cursorOutline, { scale: 1.5, opacity: 0.5, duration: 0.3 });
          });
          btn.addEventListener("mouseleave", () => {
            gsap.to(btn, { x: 0, y: 0, duration: 0.3 });
            if(cursorOutline) gsap.to(cursorOutline, { scale: 1, opacity: 1, duration: 0.3 });
          });
        });
      }
      function initLightbox() {
        const img = document.getElementById('project-main-image');
        const link = document.getElementById('project-image-link');
        
        if (img && link) {
          // Wait for image to load to get its natural dimensions
          img.onload = function() {
            link.setAttribute('data-pswp-width', img.naturalWidth);
            link.setAttribute('data-pswp-height', img.naturalHeight);
          };
          // If already loaded
          if (img.complete) {
            link.setAttribute('data-pswp-width', img.naturalWidth);
            link.setAttribute('data-pswp-height', img.naturalHeight);
          }
        }

        import('https://cdn.jsdelivr.net/npm/photoswipe@5.4.4/dist/photoswipe-lightbox.esm.min.js').then((module) => {
          const PhotoSwipeLightbox = module.default;
          const lightbox = new PhotoSwipeLightbox({
            gallery: '#project-image-link',
            pswpModule: () => import('https://cdn.jsdelivr.net/npm/photoswipe@5.4.4/dist/photoswipe.esm.min.js')
          });
          lightbox.init();
        });
      }
    </script>
  </body>
</html>
